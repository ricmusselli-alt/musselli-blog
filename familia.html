<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Familia · Panel Musselli</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="panel.css">
<style>
  .fam-hero{display:flex;align-items:center;gap:18px;margin-bottom:8px}
  .fam-hero__logo{width:64px;height:64px;border-radius:16px;background:rgba(245,240,230,.04);
    display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .fam-hero__logo img{width:44px;height:44px;object-fit:contain}
  .fam-hero__logo .fb{font-family:var(--serif);font-weight:600;font-size:var(--fs-h2);color:var(--dorado)}
  .fam-hero h1{margin:0}
  .fam-hero .estado{display:inline-flex;align-items:center;gap:7px;font-size:var(--fs-micro);letter-spacing:.12em;
    text-transform:uppercase;color:var(--texto-mute);margin-top:4px}

  /* grilla de tarjetas: 1 col en mobile, 2 en escritorio; la tarjeta principal puede ocupar el ancho */
  .ctrl-grid{display:grid;grid-template-columns:1fr;gap:20px;align-items:start}
  @media(min-width:860px){ .ctrl-grid{grid-template-columns:1fr 1fr} .card--wide{grid-column:1/-1} }

  .card > h3{display:flex;align-items:center;gap:6px;margin-bottom:14px;
    padding-bottom:12px;border-bottom:1px solid var(--linea)}
  .card__hint{font-size:var(--fs-small);color:var(--texto-mute);margin:0 0 4px;line-height:1.55}
  .card__sub{font-size:var(--fs-micro);letter-spacing:.16em;text-transform:uppercase;color:var(--cobre);
    margin:18px 0 10px}
  .card__sub:first-child{margin-top:0}

  .card .fila{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .card .fila a.lnk{font-size:var(--fs-micro);letter-spacing:.08em;text-transform:uppercase;font-weight:600;
    border:1px solid rgba(200,155,108,.35);color:var(--cobre);padding:8px 13px;border-radius:20px}
  .card .fila a.lnk:hover{border-color:var(--cobre);color:var(--negro);background:var(--cobre)}
  .mini-note{font-size:var(--fs-small);color:var(--texto-mute);margin-top:12px;line-height:1.55}

  /* fila "por línea" (Guitar Tech / Luthería) — nombre a la izquierda, controles agrupados a la derecha */
  .linea-row{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
    padding:13px 0;border-bottom:1px solid var(--linea)}
  .linea-row:last-of-type{border-bottom:0}
  .linea-row .nom{font-family:var(--serif);font-weight:600;font-size:var(--fs-value);color:var(--texto)}
  .linea-row__ctrl{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:flex-end}
  .linea-row__ctrl select{width:auto;padding:6px 9px}
  .linea-row__vence{font-size:var(--fs-small)}

  .chk-inline{display:flex;align-items:center;gap:9px;font-size:var(--fs-small);color:var(--texto-2);
    cursor:pointer;margin:14px 0 4px}
  .chk-inline input{width:auto}

  .alert-box{background:rgba(217,164,65,.1);border:1px solid rgba(217,164,65,.4);border-radius:10px;
    padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
  .alert-box a{font-weight:700;text-transform:uppercase;font-size:var(--fs-micro);letter-spacing:.1em;color:var(--dorado)}

  dialog{background:var(--panel);color:var(--texto);border:1px solid var(--linea-fuerte);border-radius:8px;
    padding:22px;max-width:440px;width:92vw}
  dialog::backdrop{background:rgba(0,0,0,.6)}
  dialog h3{font-family:var(--serif);font-weight:600;margin:0 0 14px;font-size:var(--fs-h3)}
  .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}

  /* ===== ManyRic (movido desde contenido) ===== */
  .revitem__acts{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
  /* ---- Reels de prueba ---- */
  .reel-tabs{display:flex;gap:6px;margin-bottom:14px}
  .reel-tab{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border:1px solid var(--linea);
    border-radius:10px 10px 0 0;background:rgba(245,240,230,.02);color:var(--texto-mute);font-weight:600;
    font-size:13px;cursor:pointer;border-bottom:2px solid transparent}
  .reel-tab.sel{color:var(--texto);border-color:var(--linea-fuerte);border-bottom-color:var(--cobre);background:var(--panel)}
  .reel-tab__dot{width:8px;height:8px;border-radius:50%}
  .reel-tab__dot.on{background:#54c06e} .reel-tab__dot.off{background:#8a5a2a}
  .reel-panel{background:var(--panel);border:1px solid var(--linea);border-radius:14px;padding:18px;margin-bottom:20px}
  .reel-switches{display:flex;flex-direction:column;gap:10px}
  .rl-sw{display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:12px 14px;border:1px solid var(--linea);border-radius:12px;background:rgba(245,240,230,.02)}
  .rl-sw__label{font-weight:600;font-size:13.5px;color:var(--texto)}
  .rl-sw__hint{display:block;font-size:11.5px;color:var(--texto-mute);font-weight:400;margin-top:3px;max-width:46ch}
  .rl-sw__ctl{display:inline-flex;align-items:center;gap:10px;background:none;border:0;cursor:pointer;padding:0;flex:0 0 auto}
  .rl-sw__state{font-size:11px;font-weight:800;letter-spacing:.12em;width:30px;text-align:right}
  .rl-sw__state.on{color:#54c06e} .rl-sw__state.off{color:var(--texto-mute)}
  .rl-track{width:48px;height:27px;border-radius:999px;background:#4a4a4a;position:relative;transition:background .15s;flex:0 0 auto}
  .rl-track.on{background:#3f7d4f}
  .rl-knob{position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.4)}
  .rl-track.on .rl-knob{left:24px}
  .reel-stats{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px;font-size:13px;color:var(--texto-mute)}
  .reel-stats b{color:var(--texto);font-size:15px}
  .reel-warn{margin-top:12px;font-size:12.5px;color:#e6b877;background:rgba(230,184,119,.09);
    border:1px solid rgba(230,184,119,.25);border-radius:10px;padding:9px 12px}
  .reel-alta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
  .reel-alta input,.reel-alta select{background:var(--panel);border:1px solid var(--linea);
    border-radius:9px;padding:9px 11px;color:var(--texto);font:inherit;font-size:13px}
  .reel-alta input#rlTema{flex:1;min-width:220px}
  .reel-item{display:flex;gap:16px;align-items:flex-start}
  .reel-vid{width:150px;aspect-ratio:9/16;border-radius:10px;background:#000;flex:0 0 auto}
  .reel-body{flex:1;min-width:0}
  .reel-hook{font-weight:700;font-size:15px;letter-spacing:.02em;color:var(--texto)}
  .reel-cuerpo{font-size:13px;color:var(--texto-mute);margin-top:3px}
  .reel-cta{font-size:12.5px;color:var(--cobre);margin-top:3px}
  .reel-meta{display:flex;gap:10px;align-items:center;margin:9px 0 10px;flex-wrap:wrap}
  .reel-dim{font-size:12px;color:var(--texto-mute)}
  @media(max-width:520px){.reel-item{flex-direction:column}.reel-vid{width:130px}}

  /* ---- Conversaciones IG ---- */
  .cv-sub{display:flex;gap:6px;margin:14px 0}
  .cv-sub button{padding:7px 14px;border:1px solid var(--linea);border-radius:9px;background:rgba(245,240,230,.02);
    color:var(--texto-mute);font-weight:600;font-size:12.5px;cursor:pointer}
  .cv-sub button.sel{color:var(--texto);border-color:var(--cobre);background:var(--panel)}
  .cv-regla{background:var(--panel);border:1px solid var(--linea);border-radius:12px;padding:14px;margin-bottom:12px}
  .cv-regla.off{opacity:.55}
  .cv-regla__head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .cv-regla__head .t{font-weight:700;font-size:14px;flex:1;min-width:160px;color:var(--texto)}
  .cv-regla__meta{font-size:12px;color:var(--texto-mute);margin-top:6px;line-height:1.5}
  .cv-regla__meta code{background:rgba(245,240,230,.06);padding:1px 6px;border-radius:5px;color:var(--cobre)}
  .cv-form{background:var(--panel);border:1px solid var(--linea-fuerte);border-radius:12px;padding:16px;margin-bottom:16px;display:none}
  .cv-form.show{display:block}
  .cv-form label{display:block;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--cobre);margin:12px 0 5px}
  .cv-form input[type=text],.cv-form input[type=url],.cv-form textarea,.cv-form select{
    width:100%;background:var(--panel-2,#211d1a);border:1px solid var(--linea);border-radius:8px;
    color:var(--texto);font:inherit;font-size:13px;padding:8px 10px}
  .cv-form textarea{min-height:52px;resize:vertical}
  .cv-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .cv-chip{display:inline-flex;align-items:center;gap:6px;background:rgba(200,155,108,.14);border:1px solid rgba(200,155,108,.35);
    color:var(--texto);font-size:12px;padding:3px 8px;border-radius:999px}
  .cv-chip b{cursor:pointer;color:var(--texto-mute)}
  .cv-row{display:flex;gap:12px;flex-wrap:wrap}
  .cv-row>div{flex:1;min-width:180px}
  .cv-radio{display:flex;gap:16px;font-size:13px;color:var(--texto-2);margin-top:4px}
  .cv-radio label{display:inline-flex;align-items:center;gap:6px;text-transform:none;letter-spacing:0;color:var(--texto-2);font-size:13px;margin:0}
  .cv-conv{background:var(--panel);border:1px solid var(--linea);border-radius:12px;padding:13px 15px;margin-bottom:10px}
  .cv-conv__top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .cv-conv__u{font-weight:700;font-size:13.5px;color:var(--texto)}
  .cv-conv__st{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border-radius:6px}
  .cv-conv__st.abierta{color:#e6b877;background:rgba(230,184,119,.12)}
  .cv-conv__st.humana{color:#6db3d8;background:rgba(109,179,216,.12)}
  .cv-conv__st.resuelta{color:var(--texto-mute);background:rgba(245,240,230,.05)}
  .cv-conv__msg{font-size:13px;color:var(--texto-mute);margin:7px 0;line-height:1.5}
  .cv-conv__acts{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
  .cv-conv__acts input{flex:1;min-width:200px;background:var(--panel-2,#211d1a);border:1px solid var(--linea);
    border-radius:8px;color:var(--texto);font:inherit;font-size:12.5px;padding:7px 9px}
  .cv-modlista{width:100%;min-height:70px;resize:vertical;background:var(--panel-2,#211d1a);border:1px solid var(--linea);
    border-radius:8px;color:var(--texto);font:inherit;font-size:13px;padding:8px 10px;margin:8px 0}
  .cv-modlbl{display:block;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--cobre);margin-top:10px}
  .cv-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:12px 0}
  .cv-kpi{background:var(--panel);border:1px solid var(--linea);border-radius:12px;padding:14px}
  .cv-kpi b{display:block;font-size:22px;color:var(--texto);line-height:1.1}
  .cv-kpi span{font-size:11.5px;color:var(--texto-mute)}
  .cv-embudo{margin-top:16px}
  .cv-embudo__row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--linea)}
  .cv-embudo__row .n{font-weight:700;color:var(--texto);min-width:34px;text-align:right}
  .cv-embudo__row .bar{flex:1;height:8px;border-radius:999px;background:rgba(200,155,108,.15);overflow:hidden}
  .cv-embudo__row .bar i{display:block;height:100%;background:var(--cobre)}
  .cv-embudo__row .lbl{font-size:12.5px;color:var(--texto-2);min-width:150px}
  .cv-embudo__row .lbl small{color:var(--texto-mute)}
</style>
</head>
<body>
<div class="wrap" id="app" hidden>

  <div class="page-head">
    <span class="crumb"><a href="index.html">← Portada</a> · Centro de control</span>
    <div class="fam-hero">
      <div class="fam-hero__logo" id="famLogo"></div>
      <div>
        <h1 id="famName">…</h1>
        <span class="estado" id="famEstado"></span>
      </div>
    </div>
    <p id="famDesc"></p>
    <div id="mrManualBtn"></div>
  </div>

  <div class="msg" id="topMsg"></div>
  <div id="alertPend"></div>
  <div class="ctrl-grid" id="ctrl"></div>

</div>

<dialog id="editDlg">
  <form method="dialog" id="editForm">
    <h3 id="editTitle">Editar familia</h3>
    <label class="campo"><span>Nombre</span><input id="e_name" required></label>
    <label class="campo"><span>Descripción · para qué sirve</span><textarea id="e_desc"></textarea></label>
    <label class="campo"><span>URL en vivo</span><input id="e_live" placeholder="https://…"></label>
    <label class="campo"><span>Repo GitHub (opcional)</span><input id="e_repo" placeholder="https://github.com/…"></label>
    <label class="campo"><span>Desarrollo · Claude Code, dev, docs</span><input id="e_dev" placeholder="https://claude.ai/project/…"></label>
    <label class="campo"><span>Estado</span>
      <select id="e_status">
        <option value="activo">en vivo</option>
        <option value="en_desarrollo">en desarrollo</option>
        <option value="planeado">planeado</option>
      </select></label>
    <div class="foot">
      <button type="button" class="btn-ghost btn-mini" id="editCancel">Cancelar</button>
      <button type="submit" class="btn-primary btn-mini">Guardar</button>
    </div>
  </form>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="panel.js"></script>
<script>
const { $, $$, esc, ayuda, api, edgeFn } = Panel;
const FKEY = new URLSearchParams(location.search).get("f") || "";
let DATA = null, FAM = null;

const DESC_FAMILIA = {
  blog:       "Artículos largos del blog. El sistema propone temas, escribe el borrador y vos aprobás antes de publicar.",
  tendencias: "Notas cortas de novedades del sector, verificadas antes de publicarse.",
  carrusel:   "Carruseles de Instagram (Guitar Tech y Luthería), con diseño automático y aprobación humana. Nunca publica sola.",
  web:        "La web madre ricardomusselli.com. La desarrolla un tercero; acá solo vemos si está en vivo.",
  portfolio:  "El portfolio de trabajos. Subcarpeta de la web.",
};
// A qué apunta "Crear ahora" / historial de cada familia
const GEN = {
  blog:       { product: "blog",  site: "https://blog.ricardomusselli.com/",       hint: true },
  tendencias: { product: "trend", site: "https://tendencias.ricardomusselli.com/", hint: true },
  carrusel:   { product: "carousel" },
};

/* ---------------- tarjeta: estado y enlaces ---------------- */
function cardEnlaces(){
  const p = FAM;
  const links = [
    p.live_url ? `<a class="lnk" href="${esc(p.live_url)}" target="_blank" rel="noopener">Abrir sitio ↗</a>` : "",
    p.repo_url ? `<a class="lnk" href="${esc(p.repo_url)}" target="_blank" rel="noopener">Repo ↗</a>` : "",
    p.dev_url  ? `<a class="lnk" href="${esc(p.dev_url)}" target="_blank" rel="noopener">Desarrollo ↗</a>` : "",
  ].filter(Boolean).join("");
  return `<div class="card">
    <h3>Estado y enlaces ${ayuda("Los links de esta familia y su estado. El botón Editar abre el formulario para cambiar nombre, descripción, URLs y estado.")}</h3>
    <div class="fila">${links || '<span class="mini-note">Todavía no hay links cargados.</span>'}</div>
    <button class="btn-ghost btn-mini" id="btnEdit" style="margin-top:16px">Editar familia</button>
  </div>`;
}

/* ================= ManyRic (config + bandeja + analítica) ================= */
function cardConvos(){
  return `<div class="card card--wide" style="padding-top:8px"><div id="mrRoot"></div></div>`;
}

const RL_CUENTAS = [
  { key:"luthier",    nom:"Luthería" },
  { key:"guitartech", nom:"Guitar Tech" },
];
const MR_FECHA = (s) => s ? new Date(s).toLocaleString("es-AR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}) : "—";
function mrBusy(btn,t){ btn._o=btn.innerHTML; btn.disabled=true; btn.innerHTML="… "+t; }
function mrUnbusy(btn){ if(btn._o!=null) btn.innerHTML=btn._o; btn.disabled=false; }
function mrSwitch(on,label,hint,attr){
  return `<div class="rl-sw">
    <span class="rl-sw__label">${label} ${ayuda(hint)}</span>
    <button class="rl-sw__ctl" data-${attr}="${on?"0":"1"}" aria-pressed="${on}">
      <span class="rl-sw__state ${on?"on":"off"}">${on?"ON":"OFF"}</span>
      <span class="rl-track ${on?"on":""}"><span class="rl-knob"></span></span>
    </button></div>`;
}
function mrMediaId(u){ const m=String(u||"").match(/\/(?:p|reel|reels|tv)\/([A-Za-z0-9_-]+)/); return m?m[1]:""; }

let mrCat = "luthier";
let mrTab = "reglas";      // reglas | bandeja | analitica
let mrEdit = null;
let mrChips = [];
let mrTagFilter = "";      // filtro de la bandeja por etiqueta
let mrFlujoEdit = null;    // flujo en edición ({} = nuevo) o null
let mrFlujoChips = [];

function mrReglaCard(r){
  const modo = r.match_modo === "cualquiera" ? "cualquier comentario"
    : (r.palabras_clave||[]).map(k=>`<code>${esc(k)}</code>`).join(" ");
  const alcance = r.media_id ? `post <code>${esc(r.media_id)}</code>` : "todos los posts";
  return `<div class="cv-regla ${r.activo?"":"off"}">
    <div class="cv-regla__head">
      <span class="t">${esc(r.nombre||"Regla")}</span>
      <button class="btn-ghost btn-mini" data-mr-edit="${r.id}">Editar</button>
      <button class="btn-ghost btn-mini" data-mr-toggle="${r.id}" data-on="${r.activo?0:1}">${r.activo?"Pausar":"Activar"}</button>
      <button class="btn-danger btn-mini" data-mr-del="${r.id}">Borrar</button>
    </div>
    <div class="cv-regla__meta">
      Dispara con: ${modo} · Alcance: ${alcance}<br>
      Manda: botón «${esc(r.boton_texto||"Ingresar aquí")}» → ${esc(r.link_embudo||"—")}<br>
      ${(r.dm_textos||[]).length} texto(s) de DM${r.comment_reply?" · + respuesta pública":""}${r.etiqueta?` · etiqueta «${esc(r.etiqueta)}»`:""}${r.followup_horas?` · seguimiento a ${r.followup_horas}h`:""}${r.webhook_url?" · + webhook":""}${r.ml_grupo?" · + MailerLite":""}
    </div>
  </div>`;
}

function mrEditor(){
  if (!mrEdit) return "";
  const r = mrEdit; const cualq = r.match_modo === "cualquiera";
  return `<div class="cv-form show">
    <label>Nombre de la regla (interno) ${ayuda("Solo para reconocerla vos en la lista. No la ve nadie más.")}</label>
    <input type="text" id="mrNombre" value="${esc(r.nombre||"")}" placeholder="Ej: Guía de setup">
    <div class="cv-row">
      <div><label>Link del post o reel (opcional) ${ayuda("Pegá el link de un post/reel puntual para que la regla SOLO aplique ahí. Si lo dejás vacío, aplica a cualquier post de esta cuenta.")}</label>
        <input type="url" id="mrPost" value="${esc(r.post_url||"")}" placeholder="https://instagram.com/p/…  vacío = cualquier post"></div>
      <div><label>Texto del botón ${ayuda("La palabra que ve la persona en el botón del DM, ej. 'Ingresar aquí', 'Ver la guía', 'Reservar'. Máximo 20 caracteres.")}</label>
        <input type="text" id="mrBoton" value="${esc(r.boton_texto||"Ingresar aquí")}" maxlength="20"></div>
    </div>
    <label>¿Cuándo responde? ${ayuda("Por palabra clave: solo dispara si el comentario/DM contiene alguna de las palabras que cargues abajo. Cualquier comentario: dispara SIEMPRE que alguien interactúe (usalo con cuidado, sobre todo sin restringir a un post).")}</label>
    <div class="cv-radio">
      <label><input type="radio" name="mrModo" value="keyword" ${cualq?"":"checked"}> Por palabra clave</label>
      <label><input type="radio" name="mrModo" value="cualquiera" ${cualq?"checked":""}> Cualquier comentario</label>
    </div>
    <div id="mrKW" ${cualq?"hidden":""}>
      <label>Palabras clave (variantes) ${ayuda("Escribí una palabra y Enter para agregarla como chip. Cargá todas las variantes que se te ocurran (con y sin tilde, errores comunes) — el sistema ya tolera 1-2 letras de diferencia y mayúsculas/minúsculas solo.")}</label>
      <input type="text" id="mrChipInput" placeholder="setup, seteo, quiero, info…">
      <div class="cv-chips" id="mrChips"></div>
      <div class="cv-regla__meta">Tolera acentos y 1–2 letras de error.</div>
    </div>
    <label>Link del embudo (Musselli Recursos) ${ayuda("La URL a la que vas a mandar a la persona: tu lead magnet, la página de turnos, el catálogo, etc. Puede ser cualquier link, no tiene que ser de ricardomusselli.com.")}</label>
    <input type="url" id="mrLink" value="${esc(r.link_embudo||"")}" placeholder="https://ricardomusselli.com/…">

function mrPasoADsl(p){
  const l = [`[${p.orden}] ${p.texto||""}`];
  if (p.boton_texto) l.push(`boton: ${p.boton_texto}`);
  if (p.link_embudo) l.push(`link: ${p.link_embudo}`);
  if (p.etiqueta) l.push(`etiqueta: ${p.etiqueta}`);
  if (p.ml_grupo) l.push(`grupo ml: ${p.ml_grupo}`);
  if (p.webhook_url) l.push(`webhook: ${p.webhook_url}`);
  for (const r of (p.ramas||[])) l.push(`si dice: ${(r.palabras||[]).join(", ")} -> ${r.destino==null?"fin":r.destino}`);
  if (p.default_destino !== undefined && p.default_destino !== null) l.push(`si no matchea -> ${p.default_destino}`);
  return l.join("\n");
}
function mrFlujoADsl(fl){
  return (fl.ig_flujo_pasos||[]).map(mrPasoADsl).join("\n\n");
}

  const nPasos = (fl.ig_flujo_pasos||[]).length;

  const tabs = `<div class="reel-tabs">${RL_CUENTAS.map(c=>{

    ${mrSwitch(cfg.auto_reply===true,"Respuesta pública","ON: además del DM, deja el comentario público de la regla.","mr-autoreply")}

  const faqPanel = `<div class="reel-panel"><div class="reel-switches">
    ${mrSwitch(cfg.faq_auto===true,"FAQ automática (Gemini)","ON: los DMs con preguntas comunes se responden solos. OFF: Gemini deja un borrador en la bandeja.","mr-faqauto")}
  </div>
    <label class="cv-modlbl">Información para responder ${ayuda("Todo lo que Gemini puede usar para contestar preguntas por DM: precios, turnos, envíos, qué hacés y qué no, horarios, ubicación. Escribilo como notas sueltas, no hace falta redactar bonito. Cuanto más completo, mejor responde.")} — precios, turnos, envíos, qué hacés y qué no, horarios, ubicación…</label>

    <div class="cv-regla__meta" style="margin-top:8px">Gemini responde SOLO con esto. Si piden presupuesto o turno concreto, lo deja para vos.</div>
  </div>`;

  const modPanel = `<div class="reel-panel"><div class="reel-switches">
    ${mrSwitch(cfg.mod_activa===true,"Moderación de comentarios","Oculta los comentarios que caen en la lista negra. No borra: se pueden volver a mostrar.","mr-modact")}
    ${mrSwitch(cfg.mod_ocultar_links===true,"Ocultar links de terceros","Oculta comentarios con URLs que no sean de ricardomusselli.com.","mr-modlinks")}
  </div>
    <label class="cv-modlbl">Lista negra ${ayuda("Una palabra o frase por línea. Cualquier comentario que contenga alguna se oculta solo (no se borra: podés volver a mostrarlo). Ej: vendo, sigueme, curso gratis.")} — una palabra o frase por línea</label>
    <textarea id="mrModLista" class="cv-modlista">${esc((cfg.mod_lista||[]).join("\n"))}</textarea>
    <button class="btn-ghost btn-mini" id="mrModGuardar">Guardar lista</button>
    ${ocultos.length ? `<div class="cv-modlbl" style="margin-top:14px">Ocultados recientes · ${ocultos.length}</div>` +
      ocultos.map(o=>`<div class="cv-conv"><div class="cv-conv__top">
        <span class="cv-conv__u">@${esc(o.from_username||"?")}</span><span class="reel-dim">${MR_FECHA(o.recibido_at)}</span></div>
        <div class="cv-conv__msg">${esc(o.texto||"")}</div>
        <div class="cv-conv__acts"><button class="btn-ghost btn-mini" data-mr-mostrar="${o.id}|${esc(o.external_id||"")}">Volver a mostrar</button></div>
      </div>`).join("") : ""}
  </div>`;

  const ibTxt = (cfg.ice_breakers||[]).map(x=>`${x.q} | ${x.payload}`).join("\n");
  const miTxt = (cfg.menu_items||[]).map(m=>`${m.title} | ${m.kind==="web_url"?m.url:m.payload}`).join("\n");
  const icePanel = `<div class="reel-panel">
    <div class="cv-modlbl">Ice Breakers ${ayuda("Preguntas prearmadas que Instagram muestra cuando alguien abre el DM por primera vez, antes de escribir nada. Máximo 4. Formato: Pregunta | PALABRA_CLAVE — esa palabra clave tiene que coincidir con una regla en modo 'palabra clave' para que, al tocarla, la persona reciba el DM de esa regla.")} — preguntas que aparecen al abrir el DM (máx 4) · formato: <code>Pregunta | PALABRA_CLAVE</code></div>

    <div class="revitem__acts" style="margin-top:10px">

      ${ayuda("Guardar solo lo deja listo en el panel. Publicar en Instagram lo sube de verdad al perfil de la cuenta — recién ahí la gente lo ve.")}

  const flujos = (DATA.ig_flujos || {})[mrCat] || [];
  const sub = `<div class="cv-sub">
    <button data-mrsub="reglas" class="${mrTab==="reglas"?"sel":""}">Reglas · ${reglas.length}</button>

  let cuerpo = "";

  else if (mrTab === "reglas") cuerpo = `<div class="revitem__acts" style="margin-bottom:12px"><button class="btn-solid btn-mini" id="mrNueva">+ Nueva regla</button></div>`
      + mrEditor()
      + (reglas.length ? reglas.map(mrReglaCard).join("") : `<div class="vacio">Todavía no hay reglas para esta cuenta.</div>`);
  else if (mrTab === "flujos") cuerpo = `<div class="revitem__acts" style="margin-bottom:12px"><button class="btn-solid btn-mini" id="mrFNueva">+ Nuevo flujo</button></div>`
      + mrFlujoEditor()
      + (flujos.length ? flujos.map(mrFlujoCard).join("") : `<div class="vacio">Todavía no hay flujos para esta cuenta.</div>`);
  else {
    const tagsDisp = [...new Set(convos.flatMap(c => c.tags || []))].sort();

    cuerpo = filtro + (lista.length ? lista.map(mrConvCard).join("") : `<div class="vacio">Nada para mostrar${mrTagFilter?` con la etiqueta «${esc(mrTagFilter)}»`:""}.</div>`);
  }

  const soloConfig = mrTab === "reglas";
  root.innerHTML = tabs + (soloConfig ? panelCfg + faqPanel + modPanel + icePanel : "") + sub + cuerpo;
  if (soloConfig && mrEdit) mrPintarChips();
  if (mrTab === "flujos" && mrFlujoEdit) mrPintarFChips();
}

let mrWired = false;
function mrWire(){
  if (mrWired) return; mrWired = true;
  const rerun = async () => { await reload(); };

  document.addEventListener("click", async (ev) => {
    if (!document.getElementById("mrRoot")) return;
    const t = ev.target;
    const g = (s) => t.closest(s);

    if (g("#mrIrBandeja")){ ev.preventDefault(); mrTab="bandeja"; mrEdit=null; mrRender();
      document.getElementById("mrRoot")?.scrollIntoView({behavior:"smooth"}); return; }
    const tab = g("[data-mrcat]");   if (tab){ mrCat=tab.dataset.mrcat; mrEdit=null; mrRender(); return; }

    if (g("#mrModGuardar")){ const b=g("#mrModGuardar"); mrBusy(b,"Guardando");

    const mst = g("[data-mr-mostrar]");

    function mrParseMenu(){
      const ice = (document.getElementById("mrIce").value||"").split("\n").map(l=>l.trim()).filter(Boolean)
        .map(l=>{ const [q,...r]=l.split("|"); return { q:(q||"").trim(), payload:(r.join("|")||"").trim() }; })
        .filter(x=>x.q && x.payload).slice(0,4);
      const menu = (document.getElementById("mrMenu").value||"").split("\n").map(l=>l.trim()).filter(Boolean)
        .map(l=>{ const [t,...r]=l.split("|"); const v=(r.join("|")||"").trim();
          return /^https?:\/\//i.test(v) ? { title:(t||"").trim(), kind:"web_url", url:v } : { title:(t||"").trim(), kind:"postback", payload:v }; })
        .filter(m=>m.title && (m.payload||m.url)).slice(0,5);
      return { ice, menu };
    }
    if (g("#mrMenuGuardar")){ const b=g("#mrMenuGuardar"); mrBusy(b,"Guardando"); const {ice,menu}=mrParseMenu();
      try{ await api("POST",{action:"set_ig_menu",category:mrCat,ice_breakers:ice,menu_items:menu}); await rerun(); }catch(e){ alert("Error: "+e.message); mrUnbusy(b); } return; }
    if (g("#mrMenuPublicar")){ const b=g("#mrMenuPublicar"); mrBusy(b,"Publicando"); const {ice,menu}=mrParseMenu();
      try{ await api("POST",{action:"set_ig_menu",category:mrCat,ice_breakers:ice,menu_items:menu});
           const r=await api("POST",{action:"ig_menu_publicar",category:mrCat});
           alert("Publicado en Instagram: "+r.ice_breakers+" ice breakers, "+r.menu_items+" ítems de menú.");
           await rerun(); }
      catch(e){ alert("No se pudo publicar: "+e.message); mrUnbusy(b); } return; }

    if (g("#mrNueva")){ mrEdit={match_modo:"keyword",boton_texto:"Ingresar aquí",dm_textos:[],activo:true}; mrChips=[]; mrRender(); return; }
    const ed = g("[data-mr-edit]");
    if (ed){ const r=((DATA.ig_reglas||{})[mrCat]||[]).find(x=>String(x.id)===ed.dataset.mrEdit);
      if(r){ mrEdit={...r}; mrChips=[...(r.palabras_clave||[])]; mrRender(); } return; }
    if (g("#mrCancelar")){ mrEdit=null; mrRender(); return; }
    const cd = g("[data-mr-chipdel]");
    if (cd){ mrChips.splice(Number(cd.dataset.mrChipdel),1); mrPintarChips(); return; }

    // ---- Flujos multipaso ----

    if (fcd){ mrFlujoChips.splice(Number(fcd.dataset.mrFchipdel),1); mrPintarFChips(); return; }

        match_modo:modo, palabras_clave: modo==="keyword" ? mrFlujoChips : [],
        activo: mrFlujoEdit&&mrFlujoEdit.activo===false ? false : true,

    const fdl = g("[data-mr-fdel]");

    if (g("#mrGuardar")){

        id: mrEdit&&mrEdit.id ? mrEdit.id : undefined,

        palabras_clave: modo==="keyword" ? mrChips : [],
        link_embudo:(document.getElementById("mrLink").value||"").trim(),
        boton_texto:(document.getElementById("mrBoton").value||"").trim()||"Ingresar aquí",

    const dl = g("[data-mr-del]");

      try{ await api("POST",{action:"ig_regla_del",id:Number(dl.dataset.mrDel)}); await rerun(); }catch(e){ alert("Error: "+e.message); } return; }

    const ud = g("[data-mr-usardraft]");
    if (ud){ const box=ud.closest(".cv-conv").querySelector(".cv-conv__acts"); const txt=box.dataset.draft; if(!txt) return;
      mrBusy(ud,"Enviando");
      try{ await api("POST",{action:"ig_conv_responder",category:mrCat,ig_user_id:ud.dataset.mrUsardraft,texto:txt}); await rerun(); }catch(e){ alert("No se pudo enviar: "+e.message); mrUnbusy(ud); } return; }
    const snd = g("[data-mr-send]");
    if (snd){ const box=snd.closest(".cv-conv__acts"); const txt=(box.querySelector("[data-mr-reply-input]").value||"").trim();
      if(!txt){ alert("Escribí la respuesta."); return; }
      mrBusy(snd,"Enviando");
      try{ await api("POST",{action:"ig_conv_responder",category:mrCat,ig_user_id:box.dataset.uid,texto:txt}); await rerun(); }catch(e){ alert("No se pudo enviar: "+e.message); mrUnbusy(snd); } return; }
    const rs = g("[data-mr-resolve]"), ro = g("[data-mr-reopen]");
    if (rs||ro){ const box=(rs||ro).closest(".cv-conv__acts");
      try{ await api("POST",{action:"ig_conv_estado",conv_id:Number(box.dataset.cid),estado:rs?"resuelta":"abierta"}); await rerun(); }catch(e){ alert("Error: "+e.message); } return; }
  });

  document.addEventListener("keydown", async (ev) => {
    if (!ev.target.closest) return;
    const chip = ev.target.closest("#mrChipInput");
    if (chip){
      if (ev.key === "Enter" || ev.key === ","){
        ev.preventDefault();
        const v = chip.value.trim().replace(/,$/,"");
        if (v && !mrChips.includes(v)){ mrChips.push(v); mrPintarChips(); }
        chip.value = "";
      }
      return;
    }
    const fchip = ev.target.closest("#mrFChipInput");
    if (fchip){
      if (ev.key === "Enter" || ev.key === ","){
        ev.preventDefault();
        const v = fchip.value.trim().replace(/,$/,"");
        if (v && !mrFlujoChips.includes(v)){ mrFlujoChips.push(v); mrPintarFChips(); }
        fchip.value = "";
      }
      return;
    }
    const tagin = ev.target.closest("[data-mr-tagadd]");
    if (tagin && ev.key === "Enter"){
      ev.preventDefault();
      const tag = tagin.value.trim().replace(/,$/,"");
      if (!tag) return;
      const cid = Number(tagin.dataset.mrTagadd);
      tagin.disabled = true;
      try{ await api("POST",{action:"ig_conv_tag_add",conv_id:cid,tag}); await reload(); }
      catch(e){ alert("Error: "+e.message); tagin.disabled=false; }
    }
  });
  document.addEventListener("change", (ev) => {
    if (ev.target.name === "mrModo"){
      const kw = document.getElementById("mrKW");
      if (kw) kw.hidden = ev.target.value !== "keyword";
    }
    if (ev.target.name === "mrFModo"){
      const kw = document.getElementById("mrFKW");
      if (kw) kw.hidden = ev.target.value !== "keyword";
    }
  });
}

/* ---------------- tarjeta: tokens de Instagram ---------------- */
function cardTokens(){
  const toks = {}; (DATA.ig_tokens || []).forEach(t => toks[t.category] = t.updated_at);
  const OAUTH = Panel.SUPABASE_URL + "/functions/v1/ig-oauth?category=";
  const linea = (cat, label) => {
    const upd = toks[cat];
    let estado = '<span class="linea-row__vence" style="color:var(--texto-mute)">sin token</span>';
    if (upd){
      const dias = 60 - Math.floor((Date.now() - new Date(upd).getTime())/86400000);
      const col = dias <= 7 ? 'var(--down)' : dias <= 20 ? 'var(--dorado)' : 'var(--ok)';
      estado = `<span class="linea-row__vence" style="color:${col}">vence en ${dias} día${dias===1?'':'s'}</span>`;
    }
    return `<div class="linea-row">
      <span class="nom">${label}</span>
      <span class="linea-row__ctrl">
        ${estado}
        <a class="btn btn-solid btn-mini" href="${OAUTH}${cat}" target="_blank" rel="noopener" style="text-decoration:none">Renovar</a>
      </span>
    </div>`;
  };
  return `<div class="card">
    <h3>Tokens de Instagram ${ayuda("El permiso para publicar en cada cuenta. Dura 60 días. El botón Renovar abre el login de Instagram; al aprobar, el token se guarda solo por 60 días más.")}</h3>
    <p class="card__hint">El permiso para publicar en cada cuenta. Dura 60 días.</p>
    ${linea('guitar-tech','Guitar Tech')}
    ${linea('luthier','Luthería')}
  </div>`;
}

/* ---------------- render ---------------- */
function render(){
  const st = (DATA.status || {})[FKEY] || "unknown";
  const enVivo = FAM.status === "activo";
  const ini = (FAM.name || "?").charAt(0).toUpperCase();
  $("#famLogo").innerHTML =
    `<img src="logos/${esc(FKEY)}.png" alt="" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'fb',textContent:'${esc(ini)}'}))">`;
  $("#famName").textContent = FAM.name;
  $("#famEstado").innerHTML = enVivo
    ? `<span class="dot ${st==='up'?'up':st==='down'?'down':''}"></span> ${st==='up'?'Live':st==='down'?'Caído':'sin datos'}`
    : `<span class="tag">${FAM.status === 'planeado' ? 'planeado' : 'en desarrollo'}</span>`;
  $("#famDesc").textContent = FAM.description || DESC_FAMILIA[FKEY] || "";
  const manualBox = document.getElementById("mrManualBtn");
  if (manualBox) manualBox.innerHTML = FKEY === "convos"
    ? `<a class="btn btn-ghost btn-mini" href="manyric-manual.html" target="_blank" rel="noopener" style="text-decoration:none;display:inline-block;margin-top:10px">📘 Manual de instrucciones</a>`
    : "";

  const pend = FKEY === "carrusel" ? (DATA.carrusel_drafts||[]).length
             : FKEY === "blog" ? (DATA.blog_drafts||[]).length
             : FKEY === "tendencias" ? (DATA.trend_drafts||[]).length
             : FKEY === "recursos" ? (DATA.guias||[]).filter(g => g.estado !== "publicada").length
             : FKEY === "convos" ? (((DATA.ig_pend_humano||{}).luthier||0) + ((DATA.ig_pend_humano||{}).guitartech||0)) : 0;
  const pendHref = FKEY === "recursos" ? "contenido.html#guias" : `contenido.html#${esc(FKEY)}`;
  const pendTxt = FKEY === "recursos" ? (pend===1?'guía con imágenes por revisar':'guías con imágenes por revisar')
                : FKEY === "convos" ? (pend===1?'conversación esperando respuesta':'conversaciones esperando respuesta')
                : (pend===1?'publicación':'publicaciones')+' esperando tu aprobación';
  $("#alertPend").innerHTML = pend
    ? (FKEY === "convos"
        ? `<div class="alert-box"><span><b style="color:var(--aviso)">${pend}</b> ${pendTxt}</span>
           <a href="#" id="mrIrBandeja">Ir a la bandeja →</a></div>`
        : `<div class="alert-box"><span><b style="color:var(--aviso)">${pend}</b> ${pendTxt}</span>
           <a href="${pendHref}">Revisar ahora →</a></div>`) : "";

  let cards;
  if (FKEY === "convos"){
    cards = [ cardConvos(), cardProveedores(), cardEnlaces() ];
  } else if (FKEY === "recursos"){
    cards = [ cardCrearGuia(), cardEnlaces(), cardProveedores() ];
  } else if (FAM.has_generator && FKEY === "carrusel"){
    cards = [ cardCarruselCrear(), cardCarruselConfig(), cardTokens(), cardProveedores(), cardEnlaces() ];
  } else if (FAM.has_generator && GEN[FKEY]){
    cards = [ cardGenSimple(), cardProveedores(), cardEnlaces() ];
  } else {
    cards = [ cardEnlaces(), cardProveedores() ];
  }
  $("#ctrl").innerHTML = cards.join("");

  wire();
  if (FKEY === "convos"){ mrWire(); mrRender(); }
}

/* ---------------- eventos ---------------- */
function wire(){
  const edit = $("#btnEdit");
  if (edit) edit.onclick = openEdit;

  const tg = $("#btnToggle");
  if (tg) tg.onclick = async () => {
    const next = !FAM.enabled;
    tg.disabled = true;
    try { const { property } = await api("POST", { action:"toggle", key: FKEY, enabled: next }); Object.assign(FAM, property); render(); }
    catch(e){ alert("Error: " + e.message); tg.disabled = false; }
  };

  const crear = $("#btnCrear");
  if (crear) crear.onclick = () => generar(false);
  const hintBtn = $("#btnHint");
  if (hintBtn) hintBtn.onclick = () => generar(true);

  const famFreq = $("#famFreq");
  if (famFreq) famFreq.onchange = async () => {
    famFreq.disabled = true;
    try {
      const { property } = await api("POST", { action: "set_familia_freq", key: FKEY, frecuencia: Number(famFreq.value) });
      if (property) Object.assign(FAM, property);
    } catch(e){ alert("Error: " + e.message); }
    finally { famFreq.disabled = false; }
  };

  const lead = $("#carr_lead");
  if (lead) lead.onchange = () => { $("#carr_leadFields").hidden = !lead.checked; };

  $$("[data-carractivo]").forEach(b => b.onclick = async () => {
    const cat = b.dataset.carractivo, c = cfgOf(cat), next = !(c.activo !== false);
    b.disabled = true;
    try {
      await api("POST", { action:"set_carrusel_activo", category: cat, activo: next });
      if (c.category) c.activo = next; else (DATA.carrusel_config = DATA.carrusel_config||[]).push({ category:cat, activo:next, frecuencia_mensual:1 });
      render();
    } catch(e){ alert("Error: " + e.message); b.disabled = false; }
  });
  $$("[data-carrfreq]").forEach(s => s.onchange = async () => {
    const cat = s.dataset.carrfreq, frecuencia = Number(s.value);
    s.disabled = true;
    try {
      await api("POST", { action:"set_carrusel_freq", category: cat, frecuencia });
      const c = cfgOf(cat); if (c.category) c.frecuencia_mensual = frecuencia;
      else (DATA.carrusel_config = DATA.carrusel_config||[]).push({ category:cat, frecuencia_mensual:frecuencia, activo:true });
    } catch(e){ alert("Error: " + e.message); }
    finally { s.disabled = false; }
  });

  const carrCrear = $("#carr_crear");
  if (carrCrear) carrCrear.onclick = crearCarrusel;

  const bg = $("#btnCrearGuia");
  if (bg) bg.onclick = async () => {
    const tema = ($("#gTema").value || "").trim();
    const linea = $("#gLinea").value;
    const slug = ($("#gSlug").value || "").trim();
    const m = $("#gMsg");
    if (!tema){ m.className = "msg err"; m.textContent = "Escribí un tema."; return; }
    bg.disabled = true;
    const orig = bg.innerHTML;
    bg.innerHTML = `<span class="spin"></span>Redactando…`;
    m.className = "msg"; m.textContent = "Redactando la guía… puede tardar un minuto. No cierres esta pantalla.";
    try {
      const g = await api("POST", { action: "guia_generar", slug, tema, linea });
      const realSlug = g.slug || slug;
      bg.innerHTML = `<span class="spin"></span>Generando ${g.secciones.length} imágenes…`;
      m.textContent = `"${g.titulo}" — generando ${g.secciones.length} imágenes… No cierres esta pantalla.`;
      await Promise.all(g.secciones.map(s =>
        api("POST", { action: "guia_imagen", slug: realSlug, seccion_num: s.seccion_num, accion: "generar" }).catch(() => {})
      ));
      location.href = "contenido.html#guias";
    } catch(e){
      m.className = "msg err"; m.textContent = "No se pudo: " + e.message;
      bg.disabled = false; bg.innerHTML = orig;
    }
  };
}

/* blog / tendencias */
async function generar(isHint){
  const g = GEN[FKEY]; if (!g) return;
  let hint = "";
  if (isHint){
    hint = ($("#hintInput").value || "").trim();
    if (!hint){ alert("Escribí un tema antes de proponerlo."); return; }
  }
  if (!confirm(isHint ? `¿Buscar y generar sobre "${hint}"?` : `¿Generar una publicación nueva de ${FAM.name} ahora?`)) return;
  const btn = isHint ? $("#btnHint") : $("#btnCrear");
  const orig = btn.innerHTML; btn.disabled = true;
  btn.innerHTML = `<span class="spin"></span>${isHint ? "Buscando…" : "Generando…"}`;
  try {
    let out;
    if (FKEY === "tendencias"){
      out = await edgeFn("generate-trend", { manual: true, ...(hint ? { hint } : {}) });
    } else {
      let topicId, title;
      if (hint){ const { topic } = await api("POST", { action:"propose_topic", topic: hint }); topicId = topic.id; title = topic.topic; }
      else { const { candidates } = await edgeFn("get-candidates", {}); const p = candidates[Math.floor(Math.random()*candidates.length)]; topicId = p.id; title = p.topic; }
      const d = await edgeFn("generate-post", { topic_id: topicId });
      out = { status: "generado", title: d.title || title };
    }
    if (out.status === "sin_hallazgos") alert("No encontró nada verificable esta vez. Probá de nuevo.");
    else { alert(`Generado: "${out.title || "listo"}". Revisalo en Contenido antes de aprobar.`); if (isHint) $("#hintInput").value = ""; }
  } catch(e){ alert("Error al generar: " + e.message); }
  finally { btn.disabled = false; btn.innerHTML = orig; }
}

/* carrusel */
async function crearCarrusel(){
  const category = $("#carr_cat").value;
  const topic = $("#carr_topic").value.trim();
  const useLead = $("#carr_lead").checked;
  const hook = ($("#carr_hook").value || "").trim(), cta = ($("#carr_cta").value || "").trim();
  if (useLead && (!hook || !cta)){ alert("Para Lead Magnet completá el hook y el CTA de cierre."); return; }
  if (!confirm(topic ? `¿Crear un carrusel de ${category==='luthier'?'Luthería':'Guitar Tech'} sobre "${topic}"${useLead?' (Lead Magnet)':''}?`
                     : `¿Crear un carrusel de ${category==='luthier'?'Luthería':'Guitar Tech'} con un tema del Radar?`)) return;
  const btn = $("#carr_crear"); const orig = btn.innerHTML; btn.disabled = true;
  btn.innerHTML = `<span class="spin"></span>Generando…`;
  try {
    const body = { category, manual: true };
    if (topic) body.topic = topic;
    if (useLead) body.lead_magnet = { hook, cta };
    const d = await edgeFn("generate-carrusel", body);
    if (d.status === "sin_temas_disponibles") alert("El Radar de Carruseles no tiene temas todavía. Probá con un tema puntual.");
    else if (d.status === "apagado") alert("La generación de esa línea está apagada arriba.");
    else if (d.status === "frecuencia_alcanzada") alert("Esa línea ya llegó a su límite de carruseles del mes. Subí la frecuencia si querés más.");
    else {
      alert(`Generado: "${d.topic || "listo"}". Revisalo en Contenido antes de aprobar.`);
      $("#carr_topic").value = ""; $("#carr_hook").value = ""; $("#carr_cta").value = "";
      $("#carr_lead").checked = false; $("#carr_leadFields").hidden = true;
    }
  } catch(e){ alert("Error: " + e.message); }
  finally { btn.disabled = false; btn.innerHTML = orig; }
}

/* editar familia */
function openEdit(){
  $("#e_name").value = FAM.name || "";
  $("#e_desc").value = FAM.description || "";
  $("#e_live").value = FAM.live_url || "";
  $("#e_repo").value = FAM.repo_url || "";
  $("#e_dev").value  = FAM.dev_url || "";
  $("#e_status").value = FAM.status || "activo";
  $("#editDlg").showModal();
}
$("#editCancel").addEventListener("click", () => $("#editDlg").close());
$("#editForm").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const property = {
    key: FKEY, name: $("#e_name").value.trim(), description: $("#e_desc").value.trim(),
    live_url: $("#e_live").value.trim(), repo_url: $("#e_repo").value.trim(),
    dev_url: $("#e_dev").value.trim(), status: $("#e_status").value, has_generator: FAM.has_generator,
  };
  try { await api("POST", { action:"upsert_property", property }); $("#editDlg").close(); await reload(); }
  catch(e){ alert("Error: " + e.message); }
});

async function reload(){
  DATA = await api("GET");
  FAM = (DATA.properties || []).find(p => p.key === FKEY);
  if (!FAM){ $("#topMsg").className = "msg err"; $("#topMsg").textContent = `No existe la familia "${FKEY}".`; return; }
  render();
}

Panel.init({
  page: "portada",
  onReady: async () => {
    $("#app").hidden = false;
    if (!FKEY){ $("#topMsg").className = "msg err"; $("#topMsg").textContent = "Falta indicar la familia."; return; }
    $("#topMsg").textContent = "Cargando…";
    try { await reload(); $("#topMsg").textContent = ""; }
    catch(e){ $("#topMsg").className = "msg err"; $("#topMsg").textContent = "No se pudo cargar: " + e.message; }
  },
});
</script>
